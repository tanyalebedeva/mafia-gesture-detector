[project]
name = "mafia-cv"
version = "0.2.0"
description = "Детектор жестов игры «Спортивная мафия» на YOLOv8"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
